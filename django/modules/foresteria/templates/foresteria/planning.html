{% extends 'portal/base.html' %}
{% block page_content %}
<div class="container-fluid">
  <div class="card">
    <div class="card-header d-flex justify-content-between align-items-center">
      <a href="{% url 'foresteria:planning' %}?anno={{ anno_prec }}&mese={{ mese_prec }}" class="btn btn-sm btn-outline-secondary">&laquo;</a>
      <h5 class="mb-0">Foresteria – {{ mese }}/{{ anno }}</h5>
      <a href="{% url 'foresteria:planning' %}?anno={{ anno_succ }}&mese={{ mese_succ }}" class="btn btn-sm btn-outline-secondary">&raquo;</a>
    </div>
    <div class="card-body">
        <div class="table-responsive">
            <table class="table table-bordered table-sm text-center">
                <thead>
                <tr>
                    <th>Camera</th>
                    {% for giorno in giorni %}
                    <th>{{ giorno }}</th>
                    {% endfor %}
                </tr>
                </thead>
                <tbody>
                    {% for stanza in stanze %}
                    <tr>
                    <th>{{ stanza }}</th>
                        {% for giorno in giorni %}
                            <td></td>
                        {% endfor %}
                    </tr>
                    {% endfor %}
                </tbody>
            </table>
        </div>
    </div>
  </div>
</div>
{% endblock %}
