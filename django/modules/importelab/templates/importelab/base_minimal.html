{% extends 'portal/base.html' %}

{% block extra_css %}
<style>
    body { background: #f5f5f5 !important; }
    .layout, .main-content-bg, .main-content { background: #f5f5f5 !important; color: #212529 !important; }
    table { border-collapse: collapse; width: 100%; }
    th, td { border: 1px solid #ddd; padding: .3rem .5rem; }
    th { background: #f3f3f3; }
    .muted { color: #666; font-size: .9em; }

    /* Importelab: force visible links inside app scope (portal may neutralize <a>) */
    .importelab-scope a {
        color: #0d6efd !important;
        text-decoration: underline !important;
        text-underline-offset: 2px;
    }
    .importelab-scope a:hover {
        color: #084298 !important;
        text-decoration: underline !important;
    }
    /* Keep buttons that are <a class="btn ..."> looking like buttons */
    .importelab-scope a.btn,
    .importelab-scope a.btn:hover {
        text-decoration: none !important;
    }

<style>
/* Importelab: keep order link visible but not underlined */
.importelab-scope a.importelab-order-link { text-decoration: none !important; }
.importelab-scope a.importelab-order-link:hover { text-decoration: none !important; }
</style>
</style>
{% endblock %}

{% block page_content %}
<div class="container-fluid py-4 px-4 importelab-scope">
    {% if messages %}
    {% for message in messages %}
    <div class="alert alert-{{ message.tags }} alert-dismissible fade show" role="alert">
        {{ message }}
        <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
    </div>
    {% endfor %}
    {% endif %}

    {% block content %}{% endblock %}
</div>
{% endblock %}
